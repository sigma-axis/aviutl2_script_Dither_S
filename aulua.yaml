# yaml-language-server: $schema=https://raw.githubusercontent.com/karoterra/aviutl2-aulua/refs/heads/main/schema/aulua.schema.json
project:
  variables:
    NAME: Dither_S
    AUTHOR: σ軸
    PUBLISH_PAGE: https://github.com/sigma-axis/aviutl2_script_Dither_S
    LEAST_AVIUTL_VERSION: "2011901"
    LEAST_AVIUTL_VERSION_STRING: "2.1.19a"

package:
  id: Dither_S
  name: パターンディザリングスクリプト Dither_S
  version: v1.00
  information: "{name} {version} by {AUTHOR}"
  script_sub_dir: "{id}"
  uninstall_sub_folder_file: false
  message:
    text: |
      # Dither_S AviUtl ExEdit2 パターンディザリングスクリプト

      パターン模様でのディザリングを利用した様々なフィルタ効果やシーンチェンジを追加するスクリプトです．
      画像の減色や，アルファ値グラデーションの2値化，トライトーンやテトラトーンなどを，パターンディザリングを利用して適用できます．

      公開ページ:
      https://github.com/sigma-axis/aviutl2_script_Dither_S

      紹介動画:
      https://www.nicovideo.jp/watch/sm47091286

      お願い:
      ニコニコ動画での親作品登録をしていただけると励みになります．
      作品 ID: sm47091286

  assets:
    - src: README.md
      dest: Script/{id}/README.md
    - src: LICENSE
      dest: Script/{id}/LICENSE
  file_name: package.au2pkg.zip

build:
  out_dir: build

scripts:
  - name: "Dither_S.lua"
    sources:
      - path: script/preamble.lua
      - path: script/Dither_S.lua

  - name: "@Dither_S.anm2"
    sources:
      - path: script/preamble.lua
      - label: ディザ減色σ
        path: script/effect/ディザ減色σ/main.lua
      - label: 透明度ディザσ
        path: script/effect/透明度ディザσ/main.lua
      - label: ディザポリトーンσ
        path: script/effect/ディザポリトーンσ/main.lua
      - label: ディザマスクσ
        path: script/effect/ディザマスクσ/main.lua
      - label: ディザ斜めクリッピングσ
        path: script/effect/ディザ斜めクリッピングσ/main.lua
      - label: ディザ境界ぼかしσ
        path: script/effect/ディザ境界ぼかしσ/main.lua

  - name: "@Dither_S.scn2"
    sources:
      - path: script/preamble.lua
      - label: ディザ斜めワイプσ
        path: script/transition/ディザ斜めワイプσ/main.lua
      - label: ディザシーンチェンジσ
        path: script/transition/ディザシーンチェンジσ/main.lua

language:
  files:
    - path: build/Default.Dither_S.aul2
      text: false
      tooltip: true
